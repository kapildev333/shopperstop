name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      SHOPPERSTOP_CORE_TEST_DATABASE_URL: postgres://shopperstop_core:shopperstop_core@localhost:5432/shopperstop_core_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('services/core/go.mod') == ''
        run: 'echo "core: services/core absent, skipping"'
      - if: hashFiles('services/core/go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.sum
      - if: hashFiles('services/core/go.mod') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: hashFiles('services/core/go.mod') != ''
        run: npm ci
      - if: hashFiles('services/core/go.mod') != ''
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f deploy/initdb.sql
        env:
          PGPASSWORD: postgres
      - if: hashFiles('services/core/go.mod') != ''
        run: make test-core
      - if: hashFiles('services/core/sqlc.yaml') != ''
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - if: hashFiles('services/core/go.mod') != ''
        run: |
          make gen postman
          git status --porcelain
          test -z "$(git status --porcelain)"

  rider:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      SHOPPERSTOP_RIDER_TEST_DATABASE_URL: postgres://shopperstop_rider:shopperstop_rider@localhost:5432/shopperstop_rider_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('services/rider/go.mod') == ''
        run: 'echo "rider: services/rider absent, skipping"'
      - if: hashFiles('services/rider/go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: services/rider/go.mod
          cache-dependency-path: services/rider/go.sum
      - if: hashFiles('services/rider/go.mod') != ''
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f deploy/initdb.sql
        env:
          PGPASSWORD: postgres
      - if: hashFiles('services/rider/go.mod') != ''
        run: make test-rider

  payment:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      SHOPPERSTOP_PAYMENT_TEST_DATABASE_URL: postgres://shopperstop_payment:shopperstop_payment@localhost:5432/shopperstop_payment_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('services/payment/go.mod') == ''
        run: 'echo "payment: services/payment absent, skipping"'
      - if: hashFiles('services/payment/go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: services/payment/go.mod
          cache-dependency-path: services/payment/go.sum
      - if: hashFiles('services/payment/go.mod') != ''
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f deploy/initdb.sql
        env:
          PGPASSWORD: postgres
      - if: hashFiles('services/payment/go.mod') != ''
        run: make test-payment

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('packages/ui/package.json') == ''
        run: 'echo "web: packages/ui absent, skipping"'
      - if: hashFiles('packages/ui/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: hashFiles('packages/ui/package.json') != ''
        run: npm ci
      - if: hashFiles('packages/ui/package.json') != ''
        run: make test-web

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('services/core/go.mod') == '' || (hashFiles('apps/web/package.json') == '' && hashFiles('apps/admin/package.json') == '')
        run: 'echo "e2e: services/core, or both apps/web and apps/admin, absent, skipping"'
      - if: hashFiles('services/core/go.mod') != '' && (hashFiles('apps/web/package.json') != '' || hashFiles('apps/admin/package.json') != '')
        uses: actions/setup-go@v7
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.sum
      - if: hashFiles('services/core/go.mod') != '' && (hashFiles('apps/web/package.json') != '' || hashFiles('apps/admin/package.json') != '')
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: hashFiles('services/core/go.mod') != '' && (hashFiles('apps/web/package.json') != '' || hashFiles('apps/admin/package.json') != '')
        run: |
          npm ci
          npx playwright install --with-deps chromium
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f deploy/initdb.sql
          make e2e

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @fission-ai/openspec@latest
      - run: openspec validate --all --strict
